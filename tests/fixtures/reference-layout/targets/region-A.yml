targets:
  dev-A:
    mode: development
    default: true
    workspace:
      profile: workspace-a
    variables:
      catalog: dev_retail
      alert_destination: none
  prod-A:
    mode: production
    workspace:
      profile: workspace-a
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: retail
      alert_destination: ops-alerts-a
