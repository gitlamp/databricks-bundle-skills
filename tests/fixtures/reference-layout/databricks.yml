# Follows references/bundle-layout.md. Planted defect: L012 (churn.endpoint.yaml uses
# .yaml, which the *.yml include glob does not match). Intended gap: the churn model
# exists only in region A.
bundle:
  name: retail_platform

include:
  - variables.yml
  - targets/*.yml
  - workloads/**/resources/*.yml
  - schemas/*.yml
  - volumes/*.yml
